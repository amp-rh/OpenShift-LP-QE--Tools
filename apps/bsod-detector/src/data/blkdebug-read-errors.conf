# QEMU blkdebug configuration for injecting read I/O errors.
#
# Used with the blkdebug-config chaos trigger to wrap the guest disk
# in a QEMU blkdebug driver that returns EIO on read operations.
#
# To use: modify the libvirt domain XML to reference this file via the
# qemu:commandline namespace. See chaos-triggers.json blkdebug-config
# entry for details.
#
# QEMU blkdebug docs:
#   https://www.qemu.org/docs/master/system/qemu-block-drivers.html#blkdebug

[inject-error]
event = "read_aio"
errno = 5
once = false
immediately = false
sector = -1
